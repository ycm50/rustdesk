[package]
name = "relay-bridge"
version = "0.1.0"
edition = "2021"
description = "Carries a RustDesk direct-server port to the relay Worker over WSS"
publish = false

# A dynamic library, not a program: the host loads it only when --relay-bridge is passed, so a
# host that does not relay never maps this code (or its TLS stack) into its address space.
[lib]
name = "relay_bridge"
crate-type = ["cdylib"]

# Standalone on purpose: it is not a member of host/'s workspace, so building it never pulls
# the desktop peer's native dependencies. The patch below mirrors host/Cargo.toml so both
# projects resolve the same forked websocket stack and the same cached git checkouts.

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Only for install_default(): rustls 0.23 refuses to pick a provider when several are built in.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
# Bundled roots, not the OS store: reading the Windows certificate store needs an
# interactive token, which a service-started bridge does not have.
tokio-tungstenite = { git = "https://github.com/rustdesk-org/tokio-tungstenite", rev = "c241b11b03de4881faf1ecd2fe6e867c92f3013b", version = "0.29", features = ["rustls-tls-webpki-roots"] }

[patch.crates-io]
tungstenite = { git = "https://github.com/rustdesk-org/tungstenite-rs", rev = "efce47e5364f00a63302cf07ab1fb13ded478914" }
